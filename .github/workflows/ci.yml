name: Source and native build checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Offline bundle integrity and source tests
        run: |
          python3 scripts/build_web.py
          cmp LivingUniverse.html web/index.html
          cmp web/index.html docs/index.html
          node --check validation/extension-syntax.js
          node --test source/tests/data.test.js source/tests/universe.test.js
      - name: Full source dependencies and build
        working-directory: source
        run: |
          npm ci --ignore-scripts --no-audit --fund=false
          npm test
          npm run build
  native-and-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile hosted C observer and test read-only API
        run: |
          sh scripts/build_bridge.sh
          python3 tests/test_bridge.py
          python3 tests/test_kernel_telemetry.py
      - name: Compile both bare-metal UEFI targets and validate disks
        run: |
          cd kernel
          sh scripts/test_host.sh
          sh scripts/build.sh
          (cd build && sha256sum -c SHA256SUMS)
  release-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure private backups, images and secrets are not tracked
        run: python3 scripts/check_public_release.py
