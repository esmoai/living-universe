name: Deploy interactive demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and check public static payload
        run: |
          python3 scripts/stage_pages.py
          node --check validation/extension-syntax.js
          node --test source/tests/data.test.js source/tests/universe.test.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify deployed commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 "${PAGE_URL}status.json" -o status.json
          python3 -c 'import json,os; d=json.load(open("status.json")); assert d["source_commit"] == os.environ["GITHUB_SHA"], d; print("Verified deployed commit:",d["source_commit"])'
      - name: Explain configuration requirement on failure
        if: failure()
        run: echo 'Pages must be enabled in Settings > Pages > Source > GitHub Actions. This workflow cannot grant itself repository administration permissions.'
